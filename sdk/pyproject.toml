[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilimix-cli"
version = "1.0.0"
description = "BiliMix CLI — 面向 AI Agent 的命令行接口与 Python SDK"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "BiliMix" }]
keywords = ["bilimix", "cli", "tts", "podcast", "ai-agent", "language-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Documentation = "https://github.com/changhozhao/BiliMix/blob/main/sdk/docs/cli.md"
Source = "https://github.com/changhozhao/BiliMix"

[project.scripts]
# 安装后生成 `bmx` 可执行命令
bmx = "bilimix_cli.cli:main"

[tool.setuptools]
packages = ["bilimix_cli"]
