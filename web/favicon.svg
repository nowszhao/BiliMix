<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- 圆角矩形背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 耳机图标 -->
  <path d="M16 34c0-8.8 7.2-16 16-16s16 7.2 16 16" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- 左耳罩 -->
  <rect x="12" y="32" width="8" height="14" rx="4" fill="#fff"/>
  <!-- 右耳罩 -->
  <rect x="44" y="32" width="8" height="14" rx="4" fill="#fff"/>
  <!-- 双语文字 B -->
  <text x="32" y="54" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="14" fill="#fff" opacity="0.9">B</text>
</svg>
