<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiliMix · 中英混合播客学习工具</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ====== 侧边栏 ====== -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand" onclick="switchView('updates')" style="cursor:pointer;">
                <span class="brand-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></span>
                <span class="brand-text">BiliMix</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-nav-item active" data-view="updates" onclick="switchView('updates')">
                <span class="sidebar-nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
                <span class="sidebar-nav-text">更新</span>
            </div>
            <div class="sidebar-nav-item" data-view="tasks" onclick="switchView('tasks')">
                <span class="sidebar-nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg></span>
                <span class="sidebar-nav-text">任务</span>
            </div>
            <div class="sidebar-nav-item" data-view="settings" onclick="toggleSettings()">
                <span class="sidebar-nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                <span class="sidebar-nav-text">设置</span>
            </div>
        </nav>

        <div class="sidebar-divider"></div>

        <div class="sidebar-subs-header">
            <span class="sidebar-subs-title"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="22"/><path d="M2 12h20"/></svg>订阅</span>
            <button class="sidebar-subs-add" onclick="openAddSubscriptionModal()" title="添加订阅">+</button>
        </div>
        <div class="sidebar-subs" id="sidebar-subs">
            <div class="sidebar-subs-empty">暂无订阅</div>
        </div>

        <div class="sidebar-footer">
            <button class="nav-btn nav-btn-logout" id="logout-btn" onclick="doLogout()" title="退出登录" style="display:none;">
                <span class="nav-btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                <span class="nav-btn-text">退出</span>
            </button>
        </div>
    </aside>

    <!-- ====== 主内容区 ====== -->
    <main class="main-area">

        <!-- ====== 更新页 ====== -->
        <section id="updates-view" class="content-view">
            <div class="content-header">
                <div>
                    <h1 class="content-title">更新</h1>
                    <p class="content-subtitle" id="updates-subtitle">今日 · 加载中...</p>
                </div>
                <div class="content-header-actions">
                    <button class="mark-all-read-btn" id="mark-all-read-btn" onclick="markAllRead()">✓ 全部已读</button>
                    <button class="refresh-btn" id="refresh-btn" onclick="refreshAllSubscriptions()">⟳ 刷新</button>
                </div>
            </div>

            <!-- 一级：全局时间范围 -->
            <div class="time-range-buttons">
                <button class="time-range-btn active" data-range="today" onclick="setEpisodeTimeRange('today')">今日</button>
                <button class="time-range-btn" data-range="week" onclick="setEpisodeTimeRange('week')">本周</button>
                <button class="time-range-btn" data-range="month" onclick="setEpisodeTimeRange('month')">本月</button>
                <button class="time-range-btn" data-range="all" onclick="setEpisodeTimeRange('all')">全部</button>
            </div>

            <!-- 二级：状态筛选 + 来源 -->
            <div class="seg-control">
                <div class="seg-control-item active" data-status="all" onclick="setEpisodeStatusFilter('all')">
                    <span class="seg-label">全部</span>
                    <span class="seg-count">0</span>
                </div>
                <div class="seg-control-item" data-status="unread" onclick="setEpisodeStatusFilter('unread')">
                    <span class="seg-label">未读</span>
                    <span class="seg-count">0</span>
                </div>
                <div class="seg-control-item" data-status="transcribed" onclick="setEpisodeStatusFilter('transcribed')">
                    <span class="seg-label">已转录</span>
                    <span class="seg-count">0</span>
                </div>
                <div class="seg-control-item" data-status="read" onclick="setEpisodeStatusFilter('read')">
                    <span class="seg-label">已读</span>
                    <span class="seg-count">0</span>
                </div>
            </div>

            <!-- 来源筛选 -->
            <div class="filter-bar">
                <span class="filter-source-label" id="filter-source-label" style="display:none;"></span>
                <button class="filter-clear-btn" onclick="setEpisodeRssFilter('')" style="display:none;" id="clear-rss-filter">✕ 显示全部来源</button>
            </div>

            <!-- 单集列表 -->
            <div id="episodes-list" class="updates-episodes-list">
                <div class="episodes-loading"><div class="spinner"></div><p>加载中...</p></div>
            </div>
        </section>

        <!-- ====== 任务页（提交 + 历史） ====== -->
        <section id="tasks-view" class="content-view" style="display:none;">
            <div class="content-header">
                <div>
                    <h1 class="content-title">任务</h1>
                    <p class="content-subtitle">处理历史</p>
                </div>
                <div class="content-header-actions">
                    <button class="btn-primary btn-new-task" onclick="openNewTaskModal()">
                        <span class="btn-icon">+</span>
                        <span class="btn-text">新建任务</span>
                    </button>
                </div>
            </div>

            <!-- 任务列表 -->
            <div id="tasks-list-container" class="tasks-list-container">
                <div class="episodes-loading"><div class="spinner"></div><p>加载中...</p></div>
            </div>
        </section>

        <!-- ====== 进度区 ====== -->
        <section id="progress-section" class="progress-section hidden">
            <div class="progress-card">
                <div class="progress-header">
                    <div class="progress-status">
                        <div class="spinner" id="progress-spinner"></div>
                        <span id="progress-status-text">处理中...</span>
                    </div>
                    <span class="progress-pct" id="progress-pct">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
                </div>
                <p class="progress-message" id="progress-message">准备开始...</p>
                <div class="cancel-area" id="cancel-area">
                    <button class="btn-cancel" id="cancel-btn" onclick="cancelTask()">
                        <span class="btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></span>
                        <span class="btn-text">终止任务</span>
                    </button>
                </div>
                <div class="steps-indicator" id="steps-sentence-translate">
                    <div class="step-item" id="st-step-download"><div class="step-dot"></div><span>下载</span></div>
                    <div class="step-line"></div>
                    <div class="step-item" id="st-step-transcribe"><div class="step-dot"></div><span>转录</span></div>
                    <div class="step-line"></div>
                    <div class="step-item" id="st-step-translate"><div class="step-dot"></div><span>翻译</span></div>
                    <div class="step-line"></div>
                    <div class="step-item" id="st-step-confirm"><div class="step-dot"></div><span>确认</span></div>
                    <div class="step-line"></div>
                    <div class="step-item" id="st-step-synthesize"><div class="step-dot"></div><span>合成</span></div>
                    <div class="step-line"></div>
                    <div class="step-item" id="st-step-mix"><div class="step-dot"></div><span>拼接</span></div>
                    <!-- 视频专有步骤（默认隐藏） -->
                    <div class="step-line video-step" id="st-step-line-sub"></div>
                    <div class="step-item video-step" id="st-step-subtitle"><div class="step-dot"></div><span>字幕</span></div>
                    <div class="step-line video-step" id="st-step-line-asm"></div>
                    <div class="step-item video-step" id="st-step-assemble"><div class="step-dot"></div><span>组装</span></div>
                </div>
            </div>
        </section>

        <!-- ====== 句子翻译确认区 ====== -->
        <section id="sentence-confirm-section" class="confirm-section hidden">
            <div class="confirm-card">
                <div class="pipeline-stepper">
                    <div class="stepper-step done"><div class="stepper-dot"><span>✓</span></div><span class="stepper-label">转录</span></div>
                    <div class="stepper-line done"></div>
                    <div class="stepper-step done"><div class="stepper-dot"><span>✓</span></div><span class="stepper-label">翻译</span></div>
                    <div class="stepper-line active"></div>
                    <div class="stepper-step active"><div class="stepper-dot"><span>3</span></div><span class="stepper-label">确认翻译</span></div>
                    <div class="stepper-line"></div>
                    <div class="stepper-step"><div class="stepper-dot"><span>4</span></div><span class="stepper-label">完成</span></div>
                </div>
                <p class="confirm-subtitle">AI 已将以下句子翻译为中文，请检查、编辑或取消不需要的翻译，然后继续。</p>
                <div class="sentence-confirm-body">
                    <div class="sentence-confirm-list" id="sentence-confirm-list"></div>
                </div>
                <div class="confirm-actions-bar">
                    <button class="btn-secondary" onclick="cancelFromConfirm()">← 返回首页</button>
                    <div class="confirm-actions-right">
                        <button class="btn-skip" onclick="skipSentenceConfirmation()" title="跳过确认，直接使用AI翻译">⏭ 跳过确认</button>
                        <button class="btn-primary" id="sentence-confirm-btn" onclick="submitSentenceConfirmation()">
                            <span class="btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
                            <span class="btn-text">确认并继续生成</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ====== 结果区 ====== -->
        <section id="result-section" class="result-section hidden">
            <div class="player-card">
                <div class="player-header">
                    <h2 class="section-title">🎧 混合音频</h2>
                    <div class="player-badges">
                        <span class="badge" id="badge-words">-- 句翻译</span>
                        <span class="badge" id="badge-duration">-- 秒</span>
                    </div>
                </div>
                <div class="audio-players">
                    <div class="audio-item">
                        <label class="audio-label"><span class="label-dot original"></span>原始音频</label>
                        <audio id="original-audio" controls preload="none"></audio>
                    </div>
                    <div class="audio-item" id="mixed-audio-item">
                        <label class="audio-label"><span class="label-dot mixed"></span>中英混合音频</label>
                        <audio id="mixed-audio" controls preload="none"></audio>
                    </div>
                </div>
            </div>
            <div class="tabs-card">
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="transcript" onclick="switchTab('transcript')">📝 原文转录</button>
                </div>
                <div class="tab-content active" id="tab-transcript">
                    <div class="transcript-toolbar">
                        <span class="transcript-toolbar-info" id="transcript-info"></span>
                        <div class="transcript-toolbar-actions">
                            <button class="toolbar-btn active" id="auto-scroll-btn" onclick="toggleAutoScroll()" title="自动跟随">
                                <span class="toolbar-btn-icon">📍</span><span class="toolbar-btn-text">自动跟随</span>
                            </button>
                            <button class="toolbar-btn" id="fullscreen-btn" onclick="toggleTranscriptFullscreen()" title="全屏查看">
                                <span class="toolbar-btn-icon">⛶</span><span class="toolbar-btn-text">全屏</span>
                            </button>
                            <button class="toolbar-btn" onclick="copyTranscript()" title="复制字幕到剪贴板">
                                <span class="toolbar-btn-icon">📋</span><span class="toolbar-btn-text">复制</span>
                            </button>
                        </div>
                    </div>
                    <div class="transcript-container" id="transcript-container"></div>
                </div>
            </div>
            <div class="restart-area">
                <button class="btn-secondary" onclick="goHomeFromResult()">← 返回更新列表</button>
            </div>
        </section>

                <!-- ====== 任务详情页 ====== -->
        <section id="task-detail-view" class="content-view" style="display:none;">
            <div class="detail-top">
                <a href="#" class="detail-back" onclick="switchView('tasks'); return false;">← 任务列表</a>
            </div>

            <div class="detail-hero">
                <div class="detail-hero-main">
                    <span class="detail-type-badge" id="detail-type-badge">🎬 视频配音</span>
                    <h1 class="detail-title" id="detail-title">--</h1>
                    <span class="detail-filename" id="detail-filename">--</span>
                </div>
                <span class="detail-status-tag" id="detail-status-tag">✅ 已完成</span>
            </div>

            <div class="detail-meta" id="detail-meta">
                <div class="detail-meta-item"><span class="meta-label">来源</span><span class="meta-value" id="meta-src">--</span></div>
                <div class="detail-meta-item"><span class="meta-label">创建</span><span class="meta-value" id="meta-time">--</span></div>
                <div class="detail-meta-item"><span class="meta-label">原时长</span><span class="meta-value" id="meta-dur">--</span></div>
                <div class="detail-meta-item"><span class="meta-label">译时长</span><span class="meta-value" id="meta-mdur">--</span></div>
                <div class="detail-meta-item"><span class="meta-label">翻译</span><span class="meta-value" id="meta-tr">--</span></div>
            </div>

            <div class="detail-player-card">
                <div class="detail-tabs">
                    <button class="detail-tab active" id="dt-orig" onclick="switchDetailSource('original')">🎬 原始</button>
                    <button class="detail-tab" id="dt-dub" onclick="switchDetailSource('dubbed')">✨ 配音</button>
                </div>
                <div class="detail-player-box" id="detail-video-wrapper" style="display:none;">
                    <video id="detail-video" controls preload="metadata"></video>
                </div>
                <div class="detail-player-box" id="detail-audio-inline" style="display:none;">
                    <audio id="detail-audio" controls preload="none"></audio>
                </div>
                <div class="detail-actions">
                    <a id="detail-dl-media" class="btn-primary btn-sm" href="#" style="display:none;">📥 下载</a>
                    <a id="detail-dl-srt" class="btn-secondary btn-sm" href="#">📄 字幕</a>
                </div>
            </div>

            <div class="detail-transcript-card" id="detail-subtitle-card">
                <div class="detail-transcript-hd">
                    📝 字幕 · 播放时自动高亮
                </div>
                <div class="detail-transcript-body" id="detail-transcript-container"></div>
            </div>
        </section>
<!-- JS 模块 — 按依赖顺序加载 -->
    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/audio-sync.js"></script>
    <script src="js/task.js"></script>
    <script src="js/result.js"></script>
    <script src="js/confirm.js"></script>
    <script src="js/podcast.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/episodes.js"></script>
</body>
</html>
