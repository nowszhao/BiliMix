<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiliMix · 系统架构与核心流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-paper: #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink: #2d3142;
      --color-ink-strong: #111111;
      --color-muted: #4f5d75;
      --color-soft: #5a6580;
      --color-rule: rgba(45, 49, 66, 0.12);
      --color-accent: #bf4520;
      --color-accent-tint: rgba(191, 69, 32, 0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      padding: 56px 32px 40px;
    }

    .frame {
      width: 100%;
      max-width: 1280px;
      min-width: 0;
      margin: 0 auto;
    }

    .masthead {
      max-width: 920px;
      margin-bottom: 56px;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.05;
      color: var(--color-ink);
    }

    .intro {
      max-width: 760px;
      margin-top: 20px;
      color: var(--color-muted);
      font-size: 1rem;
      line-height: 1.75;
    }

    .figure-section {
      margin-top: 56px;
    }

    .figure-section:first-of-type {
      margin-top: 0;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-rule);
    }

    h2 {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .section-note {
      color: var(--color-soft);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-align: right;
    }

    .diagram-container {
      width: 100%;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1280px;
    }

    figcaption {
      max-width: 980px;
      margin-top: 18px;
      color: var(--color-muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 64px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
      color: var(--color-soft);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      line-height: 1.6;
      letter-spacing: 0.04em;
    }

    @media (max-width: 720px) {
      .section-heading {
        display: block;
      }

      .section-note {
        margin-top: 8px;
        text-align: left;
      }

      .footer {
        display: block;
      }

      .footer span {
        display: block;
      }

      .footer span + span {
        margin-top: 6px;
      }
    }

    @media print {
      body {
        padding: 0;
      }

      .diagram-container {
        overflow-x: visible;
      }

      svg {
        min-width: 0;
      }
    }
  </style>
</head>

      <h1>边界清楚，执行收敛</h1>
      <p class="intro">

      </p>
