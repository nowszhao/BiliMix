name: Portable clients and subtitle layout
on:
  push:
  pull_request:
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./sdk pytest
      - run: python scripts/sync_skill_layout.py --check
      - run: python -m pytest tests/test_portable_clients.py tests/test_subtitle_layout.py tests/test_settings_store.py -q
      - run: python scripts/package_skills.py --output dist/skills
